<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Deep Abyss Challenge</title>
  <link rel="stylesheet" href="css/game.css?v=18" />
</head>
<body>
  <div id="stage">
    <div class="sky-glow"></div>
    <div class="water-caustic"></div>
    <canvas id="sea"></canvas>
    <div class="vignette"></div>

    <header class="hud-top">
      <div class="hud-left copper">
        <div class="points-block">
          <span class="label">POINTS</span>
          <span id="points" class="value cyan-text">0</span>
        </div>
        <div class="chip-row">
          <div class="chip shield">LVL <b id="level">1</b></div>
          <div class="chip clock">TIME <b id="time">02:00</b></div>
        </div>
      </div>
      <div class="hud-right">
        <div class="gear-lvl copper">LVL <b id="level-right">1</b></div>
        <div class="wallet copper">
          <span class="coin-icon"></span>
          <b id="gold">80,000</b>
          <span class="gem-icon"></span>
          <b id="gems">5</b>
        </div>
        <button id="btn-pause" class="pause-btn" title="Pause">❚❚</button>
      </div>
    </header>

    <div class="drawer left" id="drawer-shop">
      <aside class="panel shop copper">
        <h2>EQUIPMENT</h2>
        <div id="rods" class="item-row"></div>
        <h2>BOATS</h2>
        <div id="boats" class="item-row"></div>
        <div class="equipped">
          <div>
            <span>Current Rod</span>
            <b id="cur-rod">Basic</b>
          </div>
          <div>
            <span>Current Boat</span>
            <b id="cur-boat">Rowboat</b>
          </div>
          <div class="rent-cell">
            <span>本竿租借</span>
            <b id="rent-fee">0</b>
          </div>
        </div>
      </aside>
      <button class="drawer-tab" id="tab-shop" type="button">装备</button>
    </div>

    <div class="drawer right" id="drawer-bait">
      <aside class="panel bait copper">
        <h2>BAIT</h2>
        <div id="baits" class="bait-list"></div>
      </aside>
      <button class="drawer-tab" id="tab-bait" type="button">鱼饵</button>
    </div>

    <div id="fight-hint" class="fight-hint hidden">拉杆！</div>
    <div class="streak" id="streak" hidden>COMBO x1</div>

    <div class="banner">BINGE ON THE BEACH! DEEP ABYSS CHALLENGE</div>
    <div class="controls">
      <button id="btn-bet" class="bet-btn" type="button">
        <small>BET</small>
        <strong id="bet-amt">500</strong>
      </button>
      <div class="cast-wrap">
        <button id="btn-cast" class="cast-btn" type="button">CAST</button>
        <span id="cast-fee">本竿 750</span>
      </div>
    </div>

    <div id="toast" class="toast hidden"></div>
    <div id="catch-card" class="catch-card hidden"></div>
    <div id="pause-mask" class="mask hidden">
      <div class="pause-box copper">
        <h2>PAUSED</h2>
        <p>深渊仍在等待你的下一钩</p>
        <button id="btn-resume" class="cast-btn">RESUME</button>
      </div>
    </div>
    <div id="end-mask" class="mask hidden">
      <div class="pause-box copper">
        <h2>TIME UP</h2>
        <p id="end-summary"></p>
        <button id="btn-again" class="cast-btn">PLAY AGAIN</button>
      </div>
    </div>
  </div>
  <script src="js/game.js?v=20"></script>
</body>
</html>
